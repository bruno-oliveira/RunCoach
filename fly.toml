# fly.toml app configuration file generated for runcoach on 2025-12-27T10:26:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'runcoach'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'
  # No release_command, on purpose. A release machine does NOT get the volume:
  # `python -m app.migrations` there migrated an empty throwaway database and
  # reported success while /data/runcoach.db was never touched. Migrations run
  # in start.sh instead, on the machine that owns the volume.

[checks.liveness]
  port = 8000
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  # Liveness only: a failed check restarts the machine, which fixes a wedged
  # process and not a missing database volume. So this reads the endpoint that
  # does no I/O; the readiness check below is the one that consults the DB.
  path = "/health/live"

[env]
  DATABASE_URL = 'sqlite:////data/runcoach.db'
   # SECRET_KEY and GOOGLE_CLIENT_ID are set via Fly.io secrets
   # start.sh applies migrations before uvicorn starts; leaving this on would
   # make the lifespan repeat the same work in the same boot.
  RUN_STARTUP_MIGRATIONS = 'false'

[mounts]
  source = "runcoach_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  grace_period = '60s'

  # The proxy reads this one: a machine that cannot reach its database is
  # dropped from rotation (but not restarted) until it recovers.
  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
