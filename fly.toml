# fly.toml app configuration file generated for runcoach on 2025-12-27T10:26:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'runcoach'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

 [env]
   DATABASE_URL = 'sqlite:///./runcoach.db'
   # SECRET_KEY and GOOGLE_CLIENT_ID are set via Fly.io secrets

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
