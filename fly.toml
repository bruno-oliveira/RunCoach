# fly.toml app configuration file generated for runcoach on 2025-12-27T10:26:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'runcoach'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[checks.liveness]
  port = 8000
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[env]
  DATABASE_URL = 'sqlite:////data/runcoach.db'
   # SECRET_KEY and GOOGLE_CLIENT_ID are set via Fly.io secrets

[mounts]
  source = "runcoach_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  grace_period = '60s'

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
