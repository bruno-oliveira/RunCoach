[project]
name = "runcoach"
version = "1.0.0"
description = "Personalized Running Training Plan Generator with Nutrition Guidance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "reportlab>=4.4.0",
    "sqlalchemy>=2.0.41",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.1",
    "PyJWT[crypto]>=2.12.1",
    "cachetools>=5.5.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=65"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/migrations/*",
    "app/**/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
