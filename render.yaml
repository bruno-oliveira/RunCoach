services:
  # Web Service
  - type: web
    name: runcoach
    env: python
    region: oregon  # Change to your preferred region (oregon, frankfurt, singapore, etc.)
    plan: free  # 512 MB RAM, 0.1 CPU
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Application Settings
      - key: APP_NAME
        value: RunCoach
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: false
      
      # Database (SQLite - will be stored in /opt/render/project/src)
      - key: DATABASE_URL
        value: sqlite:///./runcoach.db
      
      # Logging
      - key: LOG_LEVEL
        value: INFO
      
      # Training Plan Constraints
      - key: MIN_WEEKS_5K
        value: 4
      - key: MIN_WEEKS_10K
        value: 6
      - key: MIN_WEEKS_HALF
        value: 8
      - key: MIN_WEEKS_30K
        value: 6
      - key: MIN_WEEKS_MARATHON
        value: 12
      
      - key: MAX_WEEKS_5K
        value: 16
      - key: MAX_WEEKS_10K
        value: 16
      - key: MAX_WEEKS_HALF
        value: 20
      - key: MAX_WEEKS_30K
        value: 20
      - key: MAX_WEEKS_MARATHON
        value: 24
      
      - key: MIN_MILEAGE_5K
        value: 5.0
      - key: MIN_MILEAGE_10K
        value: 10.0
      - key: MIN_MILEAGE_HALF
        value: 15.0
      - key: MIN_MILEAGE_30K
        value: 8.0
      - key: MIN_MILEAGE_MARATHON
        value: 25.0
      
      # OAuth / Authentication (SET THESE AS SECRETS IN RENDER DASHBOARD)
      # Don't commit real values to git!
      - key: SECRET_KEY
        sync: false  # This tells Render to not override your manually set secret
      - key: GOOGLE_CLIENT_ID
        sync: false  # This tells Render to not override your manually set secret
      
      # Session settings
      - key: SESSION_TIMEOUT_MINUTES
        value: 30
      - key: ANONYMOUS_COOKIE_MAX_AGE
        value: 2592000  # 30 days in seconds

# Optional: Add a PostgreSQL database (free for 90 days with activity)
# Uncomment if you want to migrate from SQLite to PostgreSQL
# databases:
#   - name: runcoach-db
#     databaseName: runcoach
#     user: runcoach
#     plan: free
