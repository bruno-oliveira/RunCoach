<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups">
    <title>{% block title %}RunCoach{% endblock %}</title>

    <!-- Typography: Barlow Condensed (display) + Barlow (body) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Theme init: must run before CSS to prevent flash -->
    <script>
        (function() {
            var saved = localStorage.getItem('runcoach-theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Base styles -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">

    <!-- Google Sign-In script (loaded on all pages for nav login) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        window.googleClientId = "{{ google_client_id }}";
    </script>

    <!-- Page-specific styles -->
    {% block styles %}{% endblock %}
</head>
<body>
    {% from "components/nav.html" import render as nav %}
    <!-- Navigation -->
    {% block navigation %}
    {{ nav(user=user, current_page=current_page) }}
    {% endblock %}

    <!-- Main content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% block footer %}
    <footer class="site-footer">
        <div class="container">
            <div class="footer-inner">
                <span class="footer-brand">RunCoach</span>
                <span class="footer-copy">&copy; 2026</span>
            </div>
        </div>
    </footer>
    {% endblock %}

    <!-- Base scripts -->
    <script src="/static/js/modal.js" defer></script>
    <script src="/static/js/api.js" defer></script>
    <script src="/static/js/auth.js" defer></script>

    <!-- Page-specific scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
