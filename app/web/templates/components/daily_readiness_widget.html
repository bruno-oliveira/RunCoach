<!-- Daily Readiness Check-in Widget
     Appears above the pinned "This Week" section so users log their
     morning status before looking at tomorrow's workout. JavaScript
     renders the actual form/score once /api/readiness/today resolves. -->
<section class="daily-readiness" id="daily-readiness-widget" aria-live="polite">
    <div class="daily-readiness-inner" id="daily-readiness-inner">
        <div class="daily-readiness-skeleton" aria-hidden="true">
            <div class="daily-readiness-skeleton-icon"></div>
            <div class="daily-readiness-skeleton-body">
                <div class="daily-readiness-skeleton-line skeleton-short"></div>
                <div class="daily-readiness-skeleton-line"></div>
            </div>
        </div>
    </div>
</section>
